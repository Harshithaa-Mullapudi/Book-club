<div class="card h-100" appHighlight>
  <img [src]="book.coverUrl || 'https://picsum.photos/seed/default/200/300'"
       class="card-img-top"
       [alt]="book.title">

  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ book.title }}</h5>
    <p class="card-subtitle mb-2 text-muted">{{ book.author | authorName }}</p>
    <p class="small text-truncate" [title]="book.description">{{ book.description }}</p>

    <div class="mt-auto d-flex justify-content-end">
      <button class="btn btn-sm btn-outline-primary" (click)="goToDetails()">
        Details
      </button>
    </div>
  </div>
</div>
